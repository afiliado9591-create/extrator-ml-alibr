<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extrator ML — Alibr</title><style>
:root{--y:#ffe600;--b:#3483fa;--g:#f5f5f5;--t:#222;--bd:#ddd;--ok:#00a650}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--g);color:var(--t);font:14px system-ui,sans-serif}.wrap{max-width:1000px;margin:auto}header,.card{border-radius:14px;padding:20px;margin-bottom:16px}header{background:#222;color:#fff}header h1{margin:0;font-size:21px}header span{background:var(--y);color:#222;font-size:11px;padding:4px 8px;border-radius:6px}header p{color:#bbb}.card{background:#fff;box-shadow:0 1px 3px #0001}label{display:block;font-weight:700;margin-bottom:8px}textarea{width:100%;min-height:140px;padding:12px;border:1.5px solid var(--bd);border-radius:10px;font:inherit}.actions,.head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.head{justify-content:space-between;margin:0 0 12px}button{border:0;border-radius:9px;padding:11px 17px;font-weight:700;cursor:pointer}.primary{background:var(--y)}.secondary{border:1px solid var(--bd);background:#fafafa}.status{margin-top:12px;color:#666}.bar{height:6px;background:#ddd;border-radius:4px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:var(--b)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}img{width:52px;height:52px;object-fit:cover;border-radius:7px}.price{color:var(--ok);font-weight:700}a{color:var(--b)}.pill{background:var(--g);padding:5px 9px;border-radius:15px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:9px;display:none}.muted{color:#666;font-size:12px}</style></head><body><div class="wrap">
<header><h1>Extrator de Produtos <span>MERCADO LIVRE</span></h1><p>Cole links de produto, busca ou categoria</p></header>
<section class="card"><label for="links">Links (um por linha)</label><textarea id="links" placeholder="https://produto.mercadolivre.com.br/MLB-...&#10;https://lista.mercadolivre.com.br/tenis"></textarea><p class="muted">Links de listagem extraem os produtos encontrados na página.</p><div class="actions"><button class="primary" id="go">Extrair dados</button><button class="secondary" id="clear">Limpar</button></div><div class="status" id="status" hidden>Processando...</div><div class="bar" id="bar" hidden><div class="fill" id="fill"></div></div></section>
<section class="card" id="results" hidden><div class="head"><h2>Resultados</h2><div class="actions"><span class="pill" id="count">0 produtos</span><button class="secondary" id="csv">Baixar CSV</button><button class="secondary" id="copy">Copiar tabela</button></div></div><div style="overflow:auto"><table><thead><tr><th>Imagem</th><th>Título</th><th>Descrição</th><th>Preço</th><th>Link</th></tr></thead><tbody id="body"></tbody></table></div></section></div><div class="toast" id="toast"></div><script>
const $=id=>document.getElementById(id), state=[]; const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}, product=u=>/MLB-?\d{5,}/i.test(u)||/^https?:\/\/(www\.)?meli\.la\//i.test(u), toast=s=>{$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)};
async function extract(u){try{const path=product(u)?'/api/extract':'/api/extract-list',r=await fetch(path+'?url='+encodeURIComponent(u)),d=await r.json();if(d.error)return[{originalUrl:u,error:d.error}];return product(u)?[d]:(d.products||[]).map(p=>({title:p.nome,description:'',price:p.preco,finalUrl:p.linkProduto,image:p.linkImagem,originalUrl:u}));}catch(e){return[{originalUrl:u,error:'Falha de conexão'}]}}
function row(x){const tr=document.createElement('tr');if(x.error){tr.innerHTML=`<td></td><td colspan="4" style="color:#d33">⚠ ${esc(x.error)} — ${esc(x.originalUrl)}</td>`}else{const link=x.finalUrl||x.originalUrl,price=x.price?`R$ ${Number(x.price).toLocaleString('pt-BR',{minimumFractionDigits:2})}`:'—';tr.innerHTML=`<td><img src="${esc(x.image)}" alt=""></td><td>${esc(x.title||'(sem título)')}</td><td>${esc(x.description||'')}</td><td class="price">${price}</td><td><a href="${esc(link)}" target="_blank">Abrir produto</a></td>`}$('body').appendChild(tr)}
$('go').onclick=async()=>{const urls=$('links').value.split('\n').map(s=>s.trim()).filter(s=>s.startsWith('http'));if(!urls.length)return toast('Cole ao menos um link válido');state.length=0;$('body').innerHTML='';$('results').hidden=false;$('status').hidden=$('bar').hidden=false;$('go').disabled=true;for(let i=0;i<urls.length;i++){const items=await extract(urls[i]);items.forEach(x=>{state.push(x);row(x)});$('fill').style.width=Math.round((i+1)/urls.length*100)+'%';$('status').textContent=`Processando ${i+1} de ${urls.length}...`;$('count').textContent=state.length+' produto(s)'}$('status').hidden=$('bar').hidden=true;$('go').disabled=false;toast('Extração concluída!')};
$('clear').onclick=()=>{$('links').value='';state.length=0;$('results').hidden=true};function data(sep){return state.filter(x=>!x.error).map(x=>[x.title||'',x.description||'',x.price||'',x.finalUrl||x.originalUrl||'',x.image||''].map(v=>sep===','?'"'+String(v).replaceAll('"','""')+'"':v).join(sep)).join('\n')}
$('csv').onclick=()=>{const b=new Blob(['\ufeffTitulo,Descricao,Preco,Link,Imagem\n'+data(',')],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='produtos-ml.csv';a.click();URL.revokeObjectURL(u)};$('copy').onclick=()=>navigator.clipboard.writeText('Título\tDescrição\tPreço\tLink\tImagem\n'+data('\t')).then(()=>toast('Tabela copiada!'));
</script></body></html>
